# Release: pushing a tag such as HouseLedger-v0.3.0 builds that addon's zip and publishes it as
# a GitHub release. Each addon is versioned and released on its own.
#
# Order matters. The tag must be on main and the full gate must pass before anything is
# published. Releases are immutable once published, so the release is made as a draft, the zip
# is uploaded, and only then is it published. The zip gets a signed build-provenance record
# (check it with `gh attestation verify <zip> --repo <owner>/<repo>`).
#
# GitHub-hosted runner and GitHub's own actions only, pinned to full commit SHAs. The tag name
# reaches the shell only through env, never pasted into a script.
name: release

on:
  push:
    tags: ["*-v[0-9]*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write      # create the release and upload the zip
      id-token: write      # sign the build-provenance record
      attestations: write  # store it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Tag a commit that is merged into main."
            exit 1
          fi

      - name: Install lua5.1, shellcheck, zip and unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 shellcheck zip unzip

      - name: All gates (scripts/check.sh)
        run: scripts/check.sh

      # The tag must match the addon's .toc version and have a CHANGELOG.md section.
      # SOURCE_DATE_EPOCH (the commit's time) makes the zip the same on every build.
      - name: Build the zip and release notes
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" scripts/package_addon.sh "$TAG" dist
          ls -l dist

      - name: Sign the zip's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="${TAG%-v*} ${TAG##*-v}"
          gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file dist/notes.md
          gh release upload "$TAG" dist/*.zip
          gh release edit "$TAG" --draft=false
